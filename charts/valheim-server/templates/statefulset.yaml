apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "valheim-server.fullname" . }}
  labels:
    {{- include "valheim-server.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "valheim-server.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "valheim-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "valheim-server.labels" . | nindent 8 }}
    spec:
      containers:
        - name: gameserver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: game
              containerPort: {{ .Values.server.port }}
              protocol: UDP
            - name: query
              containerPort: {{ add .Values.server.port 1 }}
              protocol: UDP
            - name: rpc
              containerPort: {{ add .Values.server.port 2 }}
              protocol: UDP
            {{- if .Values.status.enabled }}
            - name: status
              containerPort: {{ .Values.status.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: SERVER_NAME
              value: {{ .Values.server.displayName | quote }}
            - name: WORLD_NAME
              value: {{ .Values.server.worldName | quote }}
            - name: SERVER_PORT
              value: {{ .Values.server.port | quote }}
            - name: SERVER_PUBLIC
              value: {{ .Values.server.public | quote }}
            - name: CROSSPLAY
              value: {{ .Values.server.crossplay | quote }}
            {{- if .Values.server.extraArgs }}
            - name: SERVER_ARGS
              value: {{ .Values.server.extraArgs | quote }}
            {{- end }}
            {{- if .Values.server.connectHost }}
            - name: CONNECT_HOST
              value: {{ .Values.server.connectHost | quote }}
            {{- end }}
            - name: SERVER_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "valheim-server.secretName" . }}
                  key: SERVER_PASS
            - name: UPDATE_CRON
              value: {{ .Values.updates.cron | quote }}
            - name: UPDATE_IF_IDLE
              value: {{ .Values.updates.ifIdle | quote }}
            - name: RESTART_CRON
              value: {{ .Values.restart.cron | quote }}
            - name: RESTART_IF_IDLE
              value: {{ .Values.restart.ifIdle | quote }}
            - name: BACKUPS
              value: {{ .Values.backups.enabled | quote }}
            - name: BACKUPS_CRON
              value: {{ .Values.backups.cron | quote }}
            - name: BACKUPS_MAX_AGE
              value: {{ .Values.backups.maxAge | quote }}
            - name: BACKUPS_MAX_COUNT
              value: {{ .Values.backups.maxCount | quote }}
            - name: BACKUPS_IF_IDLE
              value: {{ .Values.backups.ifIdle | quote }}
            - name: BACKUPS_ZIP
              value: {{ .Values.backups.zip | quote }}
            - name: STATUS_HTTP
              value: {{ .Values.status.enabled | quote }}
            - name: STATUS_HTTP_PORT
              value: {{ .Values.status.port | quote }}
            {{- if .Values.alerts.enabled }}
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.alerts.secretRef }}{{ .Values.alerts.secretRef }}{{ else }}{{ include "valheim-server.fullname" . }}-discord{{ end }}
                  key: DISCORD_WEBHOOK_URL
            {{- end }}
            - name: BEPINEX
              value: {{ .Values.mods.enabled | quote }}
            {{- if and .Values.mods.enabled .Values.mods.failSafe }}
            - name: MOD_FAIL_SAFE
              value: "true"
            - name: MOD_REQUIRE_APPROVED_BUILD
              value: {{ .Values.mods.requireApprovedBuild | quote }}
            # Sourced, not executed: it must clear DOORSTOP_ENABLED in the
            # server script's own shell to fall back to an unmodded start.
            - name: PRE_SERVER_RUN_HOOK
              value: ". /etc/valheim-hooks/mod-guard.sh"
            {{- end }}
            - name: POST_SERVER_LISTENING_HOOK
              value: "/etc/valheim-hooks/notify.sh started"
            - name: POST_SERVER_SHUTDOWN_HOOK
              value: "/etc/valheim-hooks/notify.sh down"
            - name: POST_RESTART_HOOK
              value: "/etc/valheim-hooks/notify.sh updated"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.status.enabled }}
          startupProbe:
            httpGet:
              path: /status.json
              port: {{ .Values.status.port }}
            periodSeconds: 10
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /status.json
              port: {{ .Values.status.port }}
            periodSeconds: 30
            failureThreshold: 3
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /config
              subPath: config
            - name: data
              mountPath: /opt/valheim
              subPath: valheim
            - name: hooks
              mountPath: /etc/valheim-hooks
            - name: status-share
              mountPath: /var/run/valheim-status
        {{- if .Values.statusMetrics.enabled }}
        - name: status-metrics
          image: "{{ .Values.statusMetrics.image.repository }}:{{ .Values.statusMetrics.image.tag }}"
          imagePullPolicy: {{ .Values.statusMetrics.image.pullPolicy }}
          env:
            - name: GAMEDIG_GAME
              value: "valheim"
            - name: QUERY_HOST
              value: "127.0.0.1"
            - name: QUERY_PORT
              value: {{ .Values.statusMetrics.queryPort | quote }}
            - name: METRICS_PORT
              value: {{ .Values.statusMetrics.port | quote }}
            - name: STATUS_DIR
              value: "/var/run/valheim-status"
            - name: PERSIST_DIR
              value: "/config"
            - name: BACKUP_DIR
              value: "/config/backups"
            - name: BACKUP_MAX_AGE_DAYS
              value: {{ .Values.backups.maxAge | quote }}
            - name: BACKUP_MAX_COUNT
              value: {{ .Values.backups.maxCount | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.statusMetrics.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.statusMetrics.resources | nindent 12 }}
          volumeMounts:
            - name: status-share
              mountPath: /var/run/valheim-status
            - name: data
              mountPath: /config
              subPath: config
              readOnly: true
        {{- end }}
      volumes:
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        - name: hooks
          configMap:
            name: {{ include "valheim-server.fullname" . }}-hooks
            defaultMode: 0755
        - name: status-share
          emptyDir: {}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
