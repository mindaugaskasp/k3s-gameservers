{{- if .Values.alerts.enabled }}
{{- if not .Values.alerts.secretRef }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "valheim-server.fullname" . }}-discord
  labels:
    {{- include "valheim-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  DISCORD_WEBHOOK_URL: {{ .Values.alerts.discordWebhook | quote }}
{{- end }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "valheim-server.fullname" . }}-hooks
  labels:
    {{- include "valheim-server.labels" . | nindent 4 }}
data:
  notify.sh: |
    #!/bin/sh
    # Invoked by this image's POST_SERVER_LISTENING_HOOK / POST_SERVER_SHUTDOWN_HOOK /
    # POST_RESTART_HOOK env vars (see
    # github.com/lloesche/valheim-server-docker#environment-variables).
    # NOT POST_START_HOOK: valheim-updater's write_restart_file() sets
    # mode=start specifically when files are already current (i.e. a plain
    # container (re)start, no update) and mode=restart only when it just
    # applied a real Steam update -- so POST_START_HOOK firing does NOT
    # mean an update happened, only POST_RESTART_HOOK does.
    # Always records last-started/last-updated timestamps for the metrics
    # exporter to read off the shared status-share volume; posts a Discord
    # embed too if DISCORD_WEBHOOK_URL is set.
    set -eu
    status_dir="/var/run/valheim-status"
    persist_dir="/config"
    connect="${CONNECT_HOST:-}${CONNECT_HOST:+:${SERVER_PORT:-2456}}"

    json_escape() {
      printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
    }

    show_join=0
    case "$1" in
      started)
        date +%s > "$status_dir/last-started.timestamp"
        # Steam build ID (not the human "1.0.14" version string) -- only
        # readable from inside this container's install, gamedig has no
        # access to it.
        manifest=$(find /opt/valheim -maxdepth 4 -name 'appmanifest_896660.acf' 2>/dev/null | head -1)
        if [ -n "$manifest" ]; then
          grep -m1 '"buildid"' "$manifest" | grep -oE '[0-9]+' | tail -1 > "$status_dir/build-id" || true
        fi
        title="Server online"; color=3066993; show_join=1
        desc="**${SERVER_NAME}** is up and accepting connections."
        ;;
      down)
        # Checkpoint this session's duration into the PVC-backed cumulative
        # total (persist_dir survives restarts, status_dir doesn't) --
        # Prometheus's own history can't answer "lifetime total uptime"
        # since it only retains 7 days.
        started_at=$(cat "$status_dir/last-started.timestamp" 2>/dev/null || echo 0)
        case "$started_at" in ''|*[!0-9]*) started_at=0 ;; esac
        elapsed=0
        [ "$started_at" -gt 0 ] && elapsed=$(( $(date +%s) - started_at ))
        [ "$elapsed" -lt 0 ] && elapsed=0
        prior=$(cat "$persist_dir/uptime-accumulator.seconds" 2>/dev/null || echo 0)
        case "$prior" in ''|*[!0-9]*) prior=0 ;; esac
        echo $((prior + elapsed)) > "$persist_dir/uptime-accumulator.seconds"
        title="Server down"; color=15548997
        desc="**${SERVER_NAME}** is shutting down."
        ;;
      updated)
        date +%s > "$status_dir/last-updated.timestamp"
        title="Server updating"; color=5793266
        desc="**${SERVER_NAME}** was updated and is restarting."
        ;;
      *)
        title="Server event"; color=9807270
        desc="**${SERVER_NAME}**: $1"
        ;;
    esac

    if [ -n "${DISCORD_WEBHOOK_URL:-}" ]; then
      fields="[]"
      if [ -n "$connect" ]; then
        connect_field="{\"name\":\"Connect\",\"value\":\"$(json_escape "$connect")\",\"inline\":true},{\"name\":\"World\",\"value\":\"$(json_escape "${WORLD_NAME:-}")\",\"inline\":true}"
        join_field=""
        # steam:// direct-connect URI -- Discord only auto-links http(s),
        # so a markdown [text](steam://...) link renders as dead plain text.
        # Show it as inline code instead: not clickable, but one tap to
        # copy on desktop, then paste into Run/the browser bar to launch
        # Steam and connect -- fine since Valheim isn't mobile-playable.
        if [ "$show_join" = 1 ]; then
          join_field=",{\"name\":\"Join\",\"value\":\"\`steam://connect/$(json_escape "$connect")\`\",\"inline\":true}"
        fi
        fields="[${connect_field}${join_field}]"
      fi
      ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      payload="{\"embeds\":[{\"title\":\"$(json_escape "$title")\",\"description\":\"$(json_escape "$desc")\",\"color\":$color,\"fields\":$fields,\"timestamp\":\"$ts\"}]}"
      curl -fsS -X POST -H "Content-Type: application/json" \
        -d "$payload" "${DISCORD_WEBHOOK_URL}" >/dev/null 2>&1 || true
    fi
