image:
  repository: ghcr.io/community-valheim-tools/valheim-server
  tag: latest
  pullPolicy: IfNotPresent

server:
  displayName: "Valheim Server" # name shown in the in-game server browser
  worldName: "Dedicated" # save-file name on disk; changing it starts a NEW world
  public: true # list in the public server browser
  crossplay: false
  port: 2456 # query is port+1, RPC is port+2
  extraArgs: "" # appended to the server command line, e.g. world modifiers
  connectHost: "" # public join address shown in Discord alerts, e.g. a DDNS hostname

# UDP. Outside the default NodePort range; see docs/architecture.md.
service:
  nodePorts:
    game: 2456
    query: 2457
    rpc: 2458

# Pass at deploy time with --set-string, or point secretRef at an existing
# Secret with key SERVER_PASS. Never commit a real password.
secrets:
  serverPassword: ""
secretRef: ""

# secretRef, if set, must hold key DISCORD_WEBHOOK_URL.
alerts:
  enabled: false
  discordWebhook: ""
  secretRef: ""

updates:
  cron: "*/15 * * * *"
  ifIdle: true

restart:
  cron: "10 5 * * *"
  ifIdle: true

# Retention is whichever limit bites first. Surfaced as game_server_backup_*
# metrics, so the Grafana "Backups" row shows the effect of changes here.
backups:
  enabled: true
  cron: "5 * * * *" # how often a backup is taken
  maxAge: 5 # delete backups older than this many days (0 = no age limit)
  maxCount: 0 # keep at most this many backups (0 = no count limit)
  ifIdle: true
  zip: true

status:
  enabled: true
  port: 80

# BepInEx is installed and re-merged after game updates by the image itself;
# put plugin DLLs in /config/bepinex/plugins on the PVC.
mods:
  enabled: false
  # Start the server unmodded instead of crash-looping when BepInEx cannot
  # load. Costs nothing when mods are off.
  failSafe: true
  # BepInEx is pulled unpinned, so a game update can outrun it: drop mods
  # after an update until `make bless-mods` confirms they still work.
  requireBlessedBuild: true

persistence:
  enabled: true
  storageClassName: local-path
  size: 5Gi

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 4Gi

statusMetrics:
  enabled: true
  image:
    # localhost/ prefix is required: podman namespaces locally-built images
    # that way, and it stops containerd trying to pull from Docker Hub.
    repository: localhost/k3s-gameservers/game-status-metrics
    tag: latest
    pullPolicy: IfNotPresent
  port: 9101
  queryPort: "2457"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# Requires the VPA CRDs; install/monitoring.sh installs them.
verticalPodAutoscaler:
  enabled: false
  updateMode: "Off" # Off | Initial | Recreate | Auto
