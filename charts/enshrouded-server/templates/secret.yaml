{{- if not .Values.secretRef }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "enshrouded-server.secretName" . }}
  labels:
    {{- include "enshrouded-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  # One key per role, so a role without a password still resolves.
  {{- range .Values.roles }}
  {{ .secretKey }}: {{ index $.Values.secrets.rolePasswords .secretKey | default "" | quote }}
  {{- end }}
{{- end }}
