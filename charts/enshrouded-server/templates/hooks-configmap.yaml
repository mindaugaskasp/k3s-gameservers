apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "enshrouded-server.fullname" . }}-hooks
  labels:
    {{- include "enshrouded-server.labels" . | nindent 4 }}
data:
  # The image has no "server started" hook, so start/stop come from the
  # statefulset's `lifecycle:` block; updates come from UPDATE_POST_HOOK.
  notify.sh: |
    #!/bin/sh
    # Posts a Discord embed for a lifecycle event. Never fails the caller.
    set -u
    status_dir="/var/run/enshrouded-status"
    data_dir="/opt/enshrouded"
    version_file="$data_dir/current_version"
    build_file="$data_dir/.last-known-build"
    connect="${CONNECT_HOST:-}${CONNECT_HOST:+:${SERVER_QUERYPORT:-15637}}"

    json_escape() {
      printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
    }

    # Runs as root (lifecycle hooks) or as the game user (image hooks), so
    # write through a temp file the owning directory allows replacing.
    write_file() {
      printf '%s' "$2" > "$1.tmp.$$" 2>/dev/null || return 0
      chmod 0666 "$1.tmp.$$" 2>/dev/null
      mv -f "$1.tmp.$$" "$1" 2>/dev/null || rm -f "$1.tmp.$$"
    }

    new_build=$(cat "$version_file" 2>/dev/null || true)
    old_build=$(cat "$build_file" 2>/dev/null || true)
    [ -n "$new_build" ] && write_file "$status_dir/build-id" "$new_build"

    build_field=""
    case "$1" in
      started)
        title="Server online"; color=3066993
        desc="**${SERVER_NAME}** is up and accepting connections."
        ;;
      updated)
        title="Server updated"; color=5793266
        if [ -n "$old_build" ] && [ -n "$new_build" ] && [ "$old_build" != "$new_build" ]; then
          desc="**${SERVER_NAME}** was updated from build ${old_build} to ${new_build} and is back up."
          build_field=",{\"name\":\"Build\",\"value\":\"$(json_escape "$old_build -> $new_build")\",\"inline\":true}"
        else
          desc="**${SERVER_NAME}** restarted."
        fi
        ;;
      down)
        title="Server down"; color=15548997
        desc="**${SERVER_NAME}** is shutting down."
        ;;
      *)
        title="Server event"; color=9807270
        desc="**${SERVER_NAME}**: $1"
        ;;
    esac

    [ -n "$new_build" ] && write_file "$build_file" "$new_build"

    if [ -n "${DISCORD_WEBHOOK_URL:-}" ]; then
      fields="[]"
      if [ -n "$connect" ]; then
        fields="[{\"name\":\"Connect\",\"value\":\"$(json_escape "$connect")\",\"inline\":true}${build_field}]"
      elif [ -n "$build_field" ]; then
        fields="[${build_field#,}]"
      fi
      ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      payload="{\"embeds\":[{\"title\":\"$(json_escape "$title")\",\"description\":\"$(json_escape "$desc")\",\"color\":$color,\"fields\":$fields,\"timestamp\":\"$ts\"}]}"
      curl -fsS -X POST -H "Content-Type: application/json" \
        -d "$payload" "${DISCORD_WEBHOOK_URL}" >/dev/null 2>&1 || true
    fi

  # postStart must return fast (kubelet blocks Running on it) -- just
  # backgrounds the real logic below.
  started.sh: |
    #!/bin/sh
    nohup /etc/enshrouded-hooks/started-wait.sh >/tmp/enshrouded-started-hook.log 2>&1 &
    exit 0

  # Waits for the server to answer Steam queries, then notifies. World-writable
  # status dir: the image's own hooks run as the unprivileged game user.
  started-wait.sh: |
    #!/bin/sh
    set -u
    status_dir="/var/run/enshrouded-status"
    port="${SERVER_QUERYPORT:-15637}"
    mkdir -p "$status_dir" && chmod 0777 "$status_dir"

    # The image installs python-a2s for the game user only, so ask as them.
    query() {
      su enshrouded -s /bin/sh -c "python3 -c \"import a2s; a2s.info(('127.0.0.1', $port))\"" >/dev/null 2>&1
    }

    i=0
    # ~60 minutes: the first boot downloads the game before it can answer.
    until query; do
      i=$((i + 1))
      [ "$i" -ge 360 ] && { echo "started-hook: no query response, giving up" >&2; exit 0; }
      sleep 10
    done

    date +%s > "$status_dir/last-started.timestamp"
    /etc/enshrouded-hooks/notify.sh started

  # Runs before SIGTERM and counts against terminationGracePeriodSeconds -- kept fast.
  down.sh: |
    #!/bin/sh
    set -u
    status_dir="/var/run/enshrouded-status"
    persist_dir="/opt/enshrouded"
    started_at=$(cat "$status_dir/last-started.timestamp" 2>/dev/null || echo 0)
    case "$started_at" in ''|*[!0-9]*) started_at=0 ;; esac
    elapsed=0
    [ "$started_at" -gt 0 ] && elapsed=$(( $(date +%s) - started_at ))
    [ "$elapsed" -lt 0 ] && elapsed=0
    prior=$(cat "$persist_dir/uptime-accumulator.seconds" 2>/dev/null || echo 0)
    case "$prior" in ''|*[!0-9]*) prior=0 ;; esac
    echo $((prior + elapsed)) > "$persist_dir/uptime-accumulator.seconds"
    /etc/enshrouded-hooks/notify.sh down
