{{- if and .Values.secrets (not .Values.secretRef) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "linuxgsm-game.secretName" . }}
  labels:
    {{- include "linuxgsm-game.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Mounted into the pod as the LGSM "secrets-<instance>.cfg" file, mirroring
  # the local convention (see lgsm/config-lgsm/<instance>/secrets-*.cfg on
  # the bare-metal box this was migrated from).
  secrets-{{ .Values.game.shortname }}server.cfg: |
    {{- range $key, $value := .Values.secrets }}
    {{ $key }}="{{ $value }}"
    {{- end }}
{{- end }}
