{{- if .Values.verticalPodAutoscaler.enabled }}
# Requires VPA CRDs (scripts/install-monitoring.sh installs them).
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "linuxgsm-game.fullname" . }}
  labels:
    {{- include "linuxgsm-game.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ include "linuxgsm-game.fullname" . }}
  updatePolicy:
    updateMode: {{ .Values.verticalPodAutoscaler.updateMode | quote }}
  resourcePolicy:
    containerPolicies:
      - containerName: gameserver
        minAllowed:
          cpu: 100m
          memory: 256Mi
        maxAllowed:
          cpu: "4"
          memory: 4Gi
      - containerName: metrics-exporter
        mode: "Off"
{{- end }}
