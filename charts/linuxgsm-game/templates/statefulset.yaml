apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "linuxgsm-game.fullname" . }}
  labels:
    {{- include "linuxgsm-game.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "linuxgsm-game.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "linuxgsm-game.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "linuxgsm-game.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gameserver
          image: {{ include "linuxgsm-game.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.command }}
          command:
            {{- toYaml .Values.command | nindent 12 }}
          {{- end }}
          {{- if .Values.args }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          {{- end }}
          {{- if .Values.ports }}
          ports:
            {{- range .Values.ports }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
              protocol: {{ .protocol }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.instanceConfig }}
            - name: config
              mountPath: /data/lgsm/config-lgsm/{{ .Values.game.shortname }}server/{{ .Values.game.shortname }}server.cfg
              subPath: {{ .Values.game.shortname }}server.cfg
            {{- end }}
            {{- if .Values.secrets }}
            - name: secrets
              mountPath: /data/lgsm/config-lgsm/{{ .Values.game.shortname }}server/secrets-{{ .Values.game.shortname }}server.cfg
              subPath: secrets-{{ .Values.game.shortname }}server.cfg
            {{- end }}
        {{- if .Values.metricsExporter.enabled }}
        - name: metrics-exporter
          image: "{{ .Values.metricsExporter.image.repository }}:{{ .Values.metricsExporter.image.tag }}"
          imagePullPolicy: {{ .Values.metricsExporter.image.pullPolicy }}
          env:
            - name: GAMEDIG_GAME
              value: {{ .Values.metricsExporter.gamediggame | quote }}
            - name: QUERY_HOST
              value: "127.0.0.1"
            - name: QUERY_PORT
              value: {{ .Values.metricsExporter.queryPort | quote }}
            - name: EXPORTER_PORT
              value: {{ .Values.metricsExporter.port | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsExporter.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.metricsExporter.resources | nindent 12 }}
        {{- end }}
      volumes:
        {{- if .Values.instanceConfig }}
        - name: config
          configMap:
            name: {{ include "linuxgsm-game.fullname" . }}-config
        {{- end }}
        {{- if .Values.secrets }}
        - name: secrets
          secret:
            secretName: {{ include "linuxgsm-game.secretName" . }}
        {{- end }}
  {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
  {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        storageClassName: {{ .Values.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
