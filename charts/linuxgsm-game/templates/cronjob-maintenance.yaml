{{- if .Values.maintenance.enabled }}
{{- if .Values.maintenance.updateSchedule }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "linuxgsm-game.fullname" . }}-update
  labels:
    {{- include "linuxgsm-game.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.maintenance.updateSchedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.maintenance.historyLimit }}
  failedJobsHistoryLimit: {{ .Values.maintenance.historyLimit }}
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: {{ include "linuxgsm-game.fullname" . }}-cron
          restartPolicy: Never
          containers:
            - name: update
              image: "{{ .Values.maintenance.image.repository }}:{{ .Values.maintenance.image.tag }}"
              imagePullPolicy: {{ .Values.maintenance.image.pullPolicy }}
              command: ["sh", "/scripts/guarded-action.sh", "update"]
              env:
                - name: NAMESPACE
                  value: {{ .Release.Namespace | quote }}
                - name: POD_NAME
                  value: "{{ include "linuxgsm-game.fullname" . }}-0"
                - name: SHORTNAME
                  value: {{ .Values.game.shortname | quote }}
                - name: METRICS_PORT
                  value: {{ .Values.metricsExporter.port | quote }}
                - name: PLAYERS_METRIC
                  value: {{ .Values.maintenance.playersMetric | quote }}
                - name: WAIT_MINUTES
                  value: {{ .Values.maintenance.waitForEmptyMinutes | quote }}
              volumeMounts:
                - name: cron-script
                  mountPath: /scripts
          volumes:
            - name: cron-script
              configMap:
                name: {{ include "linuxgsm-game.fullname" . }}-cron-script
                defaultMode: 0555
{{- end }}
---
{{- if .Values.maintenance.restartSchedule }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "linuxgsm-game.fullname" . }}-restart
  labels:
    {{- include "linuxgsm-game.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.maintenance.restartSchedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.maintenance.historyLimit }}
  failedJobsHistoryLimit: {{ .Values.maintenance.historyLimit }}
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: {{ include "linuxgsm-game.fullname" . }}-cron
          restartPolicy: Never
          containers:
            - name: restart
              image: "{{ .Values.maintenance.image.repository }}:{{ .Values.maintenance.image.tag }}"
              imagePullPolicy: {{ .Values.maintenance.image.pullPolicy }}
              command: ["sh", "/scripts/guarded-action.sh", "restart"]
              env:
                - name: NAMESPACE
                  value: {{ .Release.Namespace | quote }}
                - name: POD_NAME
                  value: "{{ include "linuxgsm-game.fullname" . }}-0"
                - name: SHORTNAME
                  value: {{ .Values.game.shortname | quote }}
                - name: METRICS_PORT
                  value: {{ .Values.metricsExporter.port | quote }}
                - name: PLAYERS_METRIC
                  value: {{ .Values.maintenance.playersMetric | quote }}
                - name: WAIT_MINUTES
                  value: {{ .Values.maintenance.waitForEmptyMinutes | quote }}
              volumeMounts:
                - name: cron-script
                  mountPath: /scripts
          volumes:
            - name: cron-script
              configMap:
                name: {{ include "linuxgsm-game.fullname" . }}-cron-script
                defaultMode: 0555
{{- end }}
---
{{- if .Values.maintenance.lgsmUpdateSchedule }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "linuxgsm-game.fullname" . }}-lgsm-update
  labels:
    {{- include "linuxgsm-game.labels" . | nindent 4 }}
spec:
  # Not player-gated: `update-lgsm` only refreshes LGSM's own scripts
  # (lgsm/modules), it never touches the running game process.
  schedule: {{ .Values.maintenance.lgsmUpdateSchedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.maintenance.historyLimit }}
  failedJobsHistoryLimit: {{ .Values.maintenance.historyLimit }}
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: {{ include "linuxgsm-game.fullname" . }}-cron
          restartPolicy: Never
          containers:
            - name: lgsm-update
              image: "{{ .Values.maintenance.image.repository }}:{{ .Values.maintenance.image.tag }}"
              imagePullPolicy: {{ .Values.maintenance.image.pullPolicy }}
              command:
                - kubectl
                - exec
                - "-n"
                - {{ .Release.Namespace | quote }}
                - "{{ include "linuxgsm-game.fullname" . }}-0"
                - "-c"
                - gameserver
                - "--"
                - sh
                - "-c"
                - "cd /data && ./{{ .Values.game.shortname }}server update-lgsm"
{{- end }}
{{- end }}
