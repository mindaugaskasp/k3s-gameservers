# Default values for the linuxgsm-game chart.
# Every real game (see ../../games/<name>/values.yaml) overrides the fields
# it needs on top of this file: helm upgrade --install <name> \
#   ./charts/linuxgsm-game -f games/<name>/values.yaml -n games

game:
  # LinuxGSM short name, e.g. "vh" for Valheim. Used only for labels/notes.
  shortname: ""
  # Human readable name, used in labels and the Grafana dashboard.
  name: ""

image:
  # LinuxGSM publishes ready-to-run per-game images on Docker Hub, built
  # from the same install scripts as the bare-metal `linuxgsm.sh`.
  # https://github.com/GameServerManagers/docker-gameserver
  repository: gameservermanagers/gameserver
  # Defaults to game.shortname when empty.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# LGSM instance config written into /data/lgsm/config-lgsm/<shortname>server/<shortname>server.cfg
# via a ConfigMap. Keys/values are game specific, see games/<name>/values.yaml.
instanceConfig: {}

# Values that must not land in the ConfigMap/git history (server password,
# Discord webhook, etc). Populate at deploy time, e.g.:
#   helm upgrade --install valheim ./charts/linuxgsm-game -f games/valheim/values.yaml \
#     --set-string secrets.serverpassword="$VALHEIM_PASSWORD" \
#     --set-string secrets.discordwebhook="$VALHEIM_DISCORD_WEBHOOK"
# or point secretRef at an already-existing Secret (e.g. created by
# `kubectl create secret` or an external-secrets operator) and leave
# `secrets` empty.
secrets: {}
secretRef: ""

persistence:
  enabled: true
  storageClassName: local-path
  size: 10Gi
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# Game ports to expose. `containerPort`/`protocol` go on the Pod+Service.
# `nodePort` is optional; set it to publish the port on every node's IP
# (k3s has no cloud LoadBalancer by default, so game UDP/TCP traffic is
# normally reached via NodePort or a host network / MetalLB setup).
ports: []
# - name: game
#   containerPort: 2456
#   protocol: UDP
#   nodePort: 30456

# Enables a `hostNetwork: true` pod instead of NodePort/ClusterIP services.
# Simpler for UDP-heavy game servers on a single-node k3s box, at the cost
# of losing per-pod network isolation. Off by default.
hostNetwork: false

metricsExporter:
  # Runs the Node.js exporter in ../../monitoring/exporter as a sidecar,
  # querying the game's query port with `gamedig` and exposing Prometheus
  # metrics on :9101/metrics.
  enabled: true
  image:
    repository: k3s-linuxgsm/lgsm-exporter
    tag: latest
    pullPolicy: IfNotPresent
  port: 9101
  # gamedig game id, e.g. "valheim". See https://github.com/gamedig/node-gamedig#games-list
  gamediggame: ""
  queryPort: ""
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

serviceMonitor:
  # Requires the Prometheus Operator CRDs (installed by kube-prometheus-stack,
  # see monitoring/kube-prometheus-values.yaml).
  enabled: true
  interval: 30s
  labels: {}

# VerticalPodAutoscaler: game worlds are single-replica and stateful, so
# horizontal scaling doesn't apply. We track real usage and right-size
# requests/limits instead. Defaults to recommendation-only so it never
# evicts/restarts the pod on its own; flip updateMode to "Auto" once you
# trust the recommendations.
verticalPodAutoscaler:
  enabled: true
  updateMode: "Off" # Off | Initial | Recreate | Auto

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
