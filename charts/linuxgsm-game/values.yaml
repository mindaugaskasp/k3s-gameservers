game:
  shortname: ""
  name: ""

image:
  repository: gameservermanagers/gameserver
  tag: "" # defaults to game.shortname
  pullPolicy: IfNotPresent

replicaCount: 1

instanceConfig: {}

# Never commit real values here; pass via --set-string at deploy time,
# or set secretRef to an existing Secret instead.
secrets: {}
secretRef: ""

persistence:
  enabled: true
  storageClassName: local-path
  size: 10Gi
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

ports: []
# - name: game
#   containerPort: 2456
#   protocol: UDP
#   nodePort: 30456

hostNetwork: false

metricsExporter:
  enabled: true
  image:
    repository: k3s-linuxgsm/lgsm-exporter
    tag: latest
    pullPolicy: IfNotPresent
  port: 9101
  gamediggame: ""
  queryPort: ""
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

serviceMonitor:
  enabled: true
  interval: 30s
  labels: {}

verticalPodAutoscaler:
  enabled: true
  updateMode: "Off" # Off | Initial | Recreate | Auto

command: []
args: []

livenessProbe: {}

maintenance:
  enabled: true
  image:
    repository: rancher/kubectl
    tag: v1.30.3
    pullPolicy: IfNotPresent
  updateSchedule: ""
  restartSchedule: ""
  lgsmUpdateSchedule: ""
  playersMetric: lgsm_game_players
  waitForEmptyMinutes: 0
  historyLimit: 3

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
