apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zomboid-server.fullname" . }}-hooks
  labels:
    {{- include "zomboid-server.labels" . | nindent 4 }}
data:
  # No PRE/POST_*_HOOK system on this image -- wired via the statefulset's
  # `lifecycle:` block instead.
  notify.sh: |
    #!/bin/sh
    # Posts a Discord embed for a lifecycle event. Never fails the caller.
    set -u
    status_dir="/var/run/zomboid-status"
    connect="${CONNECT_HOST:-}${CONNECT_HOST:+:${PORT_UDP_MAIN:-16261}}"

    json_escape() {
      printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
    }

    build_field=""
    case "$1" in
      started)
        title="Server online"; color=3066993
        desc="**${SERVER_NAME}** is up and accepting connections."
        ;;
      updated)
        title="Server updating"; color=5793266
        if [ -n "${2:-}" ] && [ -n "${3:-}" ] && [ "$2" != "$3" ]; then
          desc="**${SERVER_NAME}** was updated from build ${2} to ${3} and is back up."
          build_field=",{\"name\":\"Build\",\"value\":\"$(json_escape "$2 -> $3")\",\"inline\":true}"
        else
          desc="**${SERVER_NAME}** restarted."
        fi
        ;;
      down)
        title="Server down"; color=15548997
        desc="**${SERVER_NAME}** is shutting down."
        ;;
      *)
        title="Server event"; color=9807270
        desc="**${SERVER_NAME}**: $1"
        ;;
    esac

    if [ -n "${DISCORD_WEBHOOK_URL:-}" ]; then
      fields="[]"
      if [ -n "$connect" ]; then
        fields="[{\"name\":\"Connect\",\"value\":\"$(json_escape "$connect")\",\"inline\":true}${build_field}]"
      elif [ -n "$build_field" ]; then
        fields="[${build_field#,}]"
      fi
      ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      payload="{\"embeds\":[{\"title\":\"$(json_escape "$title")\",\"description\":\"$(json_escape "$desc")\",\"color\":$color,\"fields\":$fields,\"timestamp\":\"$ts\"}]}"
      curl -fsS -X POST -H "Content-Type: application/json" \
        -d "$payload" "${DISCORD_WEBHOOK_URL}" >/dev/null 2>&1 || true
    fi

  # postStart must return fast (kubelet blocks Running on it) -- just
  # backgrounds the real logic below.
  started.sh: |
    #!/bin/sh
    nohup /etc/zomboid-hooks/started-wait.sh >/tmp/zomboid-started-hook.log 2>&1 &
    exit 0

  # Polls RCON (closest signal to "world loaded" this image gives), then notifies.
  started-wait.sh: |
    #!/bin/sh
    set -u
    status_dir="/var/run/zomboid-status"
    build_file="${CONFIG_DIR:-/project-zomboid-config}/.last-known-build"
    mkdir -p "$status_dir"

    rcon_port="${PORT_TCP_RCON:-27015}"
    i=0
    # ~30 minutes: a large modded Build 42 world can take a while to load.
    until nc -z 127.0.0.1 "$rcon_port" 2>/dev/null; do
      i=$((i + 1))
      [ "$i" -ge 180 ] && { echo "started-hook: RCON never came up, giving up" >&2; exit 0; }
      sleep 10
    done

    date +%s > "$status_dir/last-started.timestamp"

    manifest=$(find "${GAME_DIR:-/project-zomboid}" -maxdepth 3 -name 'appmanifest_380870.acf' 2>/dev/null | head -1)
    new_build=""
    [ -n "$manifest" ] && new_build=$(grep -m1 '"buildid"' "$manifest" | grep -oE '[0-9]+' | tail -1)
    [ -n "$new_build" ] && printf '%s' "$new_build" > "$status_dir/build-id"

    old_build=$(cat "$build_file" 2>/dev/null || true)
    if [ -n "$old_build" ] && [ -n "$new_build" ] && [ "$old_build" != "$new_build" ]; then
      /etc/zomboid-hooks/notify.sh updated "$old_build" "$new_build"
    else
      /etc/zomboid-hooks/notify.sh started
    fi
    [ -n "$new_build" ] && printf '%s' "$new_build" > "$build_file"

  # Runs before SIGTERM and counts against terminationGracePeriodSeconds -- kept fast.
  down.sh: |
    #!/bin/sh
    set -u
    status_dir="/var/run/zomboid-status"
    persist_dir="${CONFIG_DIR:-/project-zomboid-config}"
    started_at=$(cat "$status_dir/last-started.timestamp" 2>/dev/null || echo 0)
    case "$started_at" in ''|*[!0-9]*) started_at=0 ;; esac
    elapsed=0
    [ "$started_at" -gt 0 ] && elapsed=$(( $(date +%s) - started_at ))
    [ "$elapsed" -lt 0 ] && elapsed=0
    prior=$(cat "$persist_dir/uptime-accumulator.seconds" 2>/dev/null || echo 0)
    case "$prior" in ''|*[!0-9]*) prior=0 ;; esac
    echo $((prior + elapsed)) > "$persist_dir/uptime-accumulator.seconds"
    /etc/zomboid-hooks/notify.sh down
