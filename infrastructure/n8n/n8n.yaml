apiVersion: v1
kind: Service
metadata:
  name: n8n
  labels:
    app.kubernetes.io/name: n8n
spec:
  selector:
    app.kubernetes.io/name: n8n
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  labels:
    app.kubernetes.io/name: n8n
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  labels:
    app.kubernetes.io/name: n8n
spec:
  replicas: 1
  # The ReadWriteOnce volume can't attach to old and new pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
    spec:
      # This Service is called n8n, so Kubernetes' service-link vars would inject
      # N8N_PORT=tcp://<clusterIP>:80 over n8n's own listen-port setting.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: n8n
          image: docker.io/n8nio/n8n:2.47.7@sha256:b4b90747b81fcda7e76550c0d3aa7f0f64917a1e9573cff40d6834eaf2e0f8ea
          env:
            - name: N8N_HOST
              value: N8N_HOST # from infrastructure/site.env
            - name: N8N_EDITOR_BASE_URL
              value: http://N8N_HOST/ # from infrastructure/site.env
            # The URL external callers use; without it n8n shows pod-internal webhook URLs.
            - name: N8N_WEBHOOK_URL
              value: http://N8N_HOST/ # from infrastructure/site.env
            # A Secure cookie is never sent over plain HTTP, so login would fail.
            # Set this back to true once n8n is served over TLS.
            - name: N8N_SECURE_COOKIE
              value: "false"
            # One reverse proxy (Traefik) sits in front, so trust one X-Forwarded-For hop.
            - name: N8N_PROXY_HOPS
              value: "1"
            # Cron schedules read this; n8n's own default is America/New_York.
            - name: GENERIC_TIMEZONE
              value: UTC
            # Encrypts saved credentials. Losing it makes every stored credential
            # unreadable, so install.sh creates it once and never rewrites it.
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-encryption-key
                  key: key
            # Node sizes its heap from the host's total RAM, not this container's
            # limit, and would grow past it until the kernel killed the pod.
            - name: NODE_OPTIONS
              value: --max-old-space-size=512
            # Defaults n8n warns it will change in a later version, pinned here so an
            # image bump can't move them. The two compression caps are what a 2 GiB
            # decompression would need, well past this container's limit.
            - name: N8N_UNVERIFIED_PACKAGES_ENABLED
              value: "false"
            - name: N8N_RUNNERS_TASK_TIMEOUT
              value: "300"
            - name: N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES
              value: "268435456"
            - name: N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES
              value: "1000"
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            - name: N8N_VERSION_NOTIFICATIONS_ENABLED
              value: "false"
            - name: N8N_PERSONALIZATION_ENABLED
              value: "false"
            - name: N8N_HIRING_BANNER_ENABLED
              value: "false"
            - name: N8N_TEMPLATES_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 5678
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Holds database.sqlite and the settings file; N8N_USER_FOLDER defaults to $HOME.
            - name: data
              mountPath: /home/node/.n8n
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: n8n-lan-only@kubernetescrd
spec:
  rules:
    - host: N8N_HOST # from infrastructure/site.env
      http: &n8n-backend
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  name: http
    - host: n8n.lan
      http: *n8n-backend
