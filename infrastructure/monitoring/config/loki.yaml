auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Repeat dashboard loads answer from cache; splits keep one panel from hogging the querier.
query_range:
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

querier:
  max_concurrent: 8

limits_config:
  split_queries_by_interval: 1h
  max_query_parallelism: 8
  # 31 days: the website dashboard counts returning IPs over the last 30.
  retention_period: 744h
  # Default 500; per-path tables over bot-probed URLs exceed it.
  max_query_series: 5000
  # Used by Grafana's Logs Drilldown app
  allow_structured_metadata: true
  volume_enabled: true

pattern_ingester:
  enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
