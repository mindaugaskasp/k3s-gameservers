{{- if not .Values.secretRef }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "game-server.secretName" . }}
  labels:
    {{- include "game-server.labels" . | nindent 4 }}
type: Opaque
data:
  # Empty unless a client-protection password blocks the exporter's passwordless login.
  API_TOKEN: {{ .Values.secrets.apiToken | b64enc | quote }}
{{- end }}
