apiVersion: v1
kind: Service
metadata:
  name: {{ include "game-server.fullname" . }}
  labels:
    {{- include "game-server.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "game-server.selectorLabels" . | nindent 4 }}
  # Players need all three: the game over UDP, the HTTPS API they join through over
  # TCP on the same port, and the engine's reliable messaging. The API only grants
  # admin commands to a claimed login, so exposing it is the game's own design.
  ports:
    - name: game
      port: {{ .Values.server.gamePort }}
      targetPort: {{ .Values.server.gamePort }}
      protocol: UDP
      nodePort: {{ .Values.service.nodePorts.game }}
    - name: api
      port: {{ .Values.server.gamePort }}
      targetPort: {{ .Values.server.gamePort }}
      protocol: TCP
      nodePort: {{ .Values.service.nodePorts.game }}
    - name: messaging
      port: {{ .Values.server.messagingPort }}
      targetPort: {{ .Values.server.messagingPort }}
      protocol: TCP
      nodePort: {{ .Values.service.nodePorts.messaging }}
