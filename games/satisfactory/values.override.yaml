# Overrides chart/values.yaml. Secrets never go here; games/satisfactory/.env overrides the server settings.

server:
  slotCount: 4
  # 7777 belongs to Terraria on this cluster; the client takes any port in the address.
  gamePort: 7779
  messagingPort: 8890

# SATISFACTORY_GAME_SETTINGS in .env overrides these.
gameSettings: {}

service:
  nodePorts:
    game: 7779
    messaging: 8890

persistence:
  storageClassName: local-path
  size: 30Gi

# Upstream asks for more RAM than this; check the VPA recommendation before
# changing it. Sizing rules: docs/architecture.md#sizing.
resources:
  requests:
    cpu: "2"
    memory: 6Gi
  limits:
    memory: 8Gi

# updateMode stays "Off" (chart default) -- recommendations only, never
# evictions. See docs/architecture.md and platform/vpa/install.sh.
verticalPodAutoscaler:
  enabled: true

backups:
  intervalMinutes: 60
  maxCount: 48
