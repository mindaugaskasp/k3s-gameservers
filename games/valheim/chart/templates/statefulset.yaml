apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "game-server.fullname" . }}
  labels:
    {{- include "game-server.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "game-server.fullname" . }}
  # Keep the live replica count so an upgrade never restarts a game scaled to 0.
  {{- $live := lookup "apps/v1" "StatefulSet" .Release.Namespace (include "game-server.fullname" .) }}
  replicas: {{ if $live }}{{ $live.spec.replicas }}{{ else }}1{{ end }}
  selector:
    matchLabels:
      {{- include "game-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "game-server.labels" . | nindent 8 }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gameserver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}{{ with .Values.image.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # Start-up chown and user switch, signals to the game, httpd on port 80.
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "FSETID", "KILL", "SETUID", "SETGID", "NET_BIND_SERVICE"]
          ports:
            - name: game
              containerPort: {{ .Values.server.port }}
              protocol: UDP
            - name: query
              containerPort: {{ add .Values.server.port 1 }}
              protocol: UDP
            - name: rpc
              containerPort: {{ add .Values.server.port 2 }}
              protocol: UDP
            {{- if .Values.status.enabled }}
            - name: status
              containerPort: {{ .Values.status.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: PUID
              value: {{ .Values.gameUser.uid | quote }}
            - name: PGID
              value: {{ .Values.gameUser.gid | quote }}
            - name: SERVER_NAME
              value: {{ .Values.server.displayName | quote }}
            - name: WORLD_NAME
              value: {{ .Values.server.worldName | quote }}
            - name: SERVER_PORT
              value: {{ .Values.server.port | quote }}
            - name: SERVER_PUBLIC
              value: {{ .Values.server.public | quote }}
            - name: CROSSPLAY
              value: {{ .Values.server.crossplay | quote }}
            {{- if .Values.server.extraArgs }}
            - name: SERVER_ARGS
              value: {{ .Values.server.extraArgs | quote }}
            {{- end }}
            {{- if .Values.server.connectHost }}
            - name: CONNECT_HOST
              value: {{ .Values.server.connectHost | quote }}
            {{- end }}
            - name: SERVER_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "game-server.secretName" . }}
                  key: SERVER_PASS
            - name: UPDATE_CRON
              value: {{ .Values.updates.cron | quote }}
            - name: UPDATE_IF_IDLE
              value: {{ .Values.updates.ifIdle | quote }}
            - name: RESTART_CRON
              value: {{ .Values.restart.cron | quote }}
            - name: RESTART_IF_IDLE
              value: {{ .Values.restart.ifIdle | quote }}
            - name: BACKUPS
              value: {{ .Values.backups.enabled | quote }}
            # The image prefixes its backup trigger with this, so the gate
            # decides whether the trigger runs.
            - name: BACKUPS_CRON
              value: {{ printf "%s /etc/valheim-hooks/backup-gate.sh &&" .Values.backups.cron | quote }}
            # The image's own pruning (wall-clock age, newest-N count, both
            # reaching into archive/) stays off; backup-prune.sh does it.
            - name: BACKUPS_MAX_AGE
              value: "36500"
            # Drops the image's start-up backup when nobody played, names
            # backups by in-game day, then prunes.
            - name: POST_BACKUP_HOOK
              value: {{ printf "/etc/valheim-hooks/backup-gate.sh @BACKUP_FILE@ || rm -f @BACKUP_FILE@; /etc/valheim-hooks/backup-rename.sh /config/backups; /etc/valheim-hooks/backup-prune.sh /config/backups %v %s" .Values.backups.recentDays (join " " .Values.backups.backupArchiveWindowDays) | quote }}
            - name: BACKUPS_MAX_COUNT
              value: "0"
            - name: BACKUPS_IF_IDLE
              value: "true" # backup-gate.sh does the idle check
            - name: BACKUPS_ZIP
              value: {{ .Values.backups.zip | quote }}
            - name: STATUS_HTTP
              value: {{ .Values.status.enabled | quote }}
            - name: STATUS_HTTP_PORT
              value: {{ .Values.status.port | quote }}
            {{- if .Values.alerts.enabled }}
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "game-server.discordSecretName" . }}
                  key: DISCORD_WEBHOOK_URL
            {{- end }}
            - name: BEPINEX
              value: {{ .Values.mods.enabled | quote }}
            {{- if and .Values.mods.enabled .Values.mods.failSafe }}
            - name: MOD_FAIL_SAFE
              value: "true"
            - name: MOD_REQUIRE_APPROVED_BUILD
              value: {{ .Values.mods.requireApprovedBuild | quote }}
            # Sourced, not executed: it must clear DOORSTOP_ENABLED in the
            # server script's own shell to fall back to an unmodded start.
            - name: PRE_SERVER_RUN_HOOK
              value: ". /etc/valheim-hooks/mod-guard.sh"
            {{- end }}
            - name: POST_SERVER_LISTENING_HOOK
              value: "/etc/valheim-hooks/notify.sh started"
            - name: POST_SERVER_SHUTDOWN_HOOK
              value: "/etc/valheim-hooks/notify.sh down"
            - name: POST_RESTART_HOOK
              value: "/etc/valheim-hooks/notify.sh updated"
            # Who's online, for valheim_player_online: see player-event.sh.
            {{- range $name, $match := dict "Handshake" "Got handshake from client " "Spawned" "Got character ZDOID from " "Left" "Closing socket " }}
            - name: VALHEIM_LOG_FILTER_CONTAINS_Player{{ $name }}
              value: {{ $match | quote }}
            - name: ON_VALHEIM_LOG_FILTER_CONTAINS_Player{{ $name }}
              value: "/etc/valheim-hooks/player-event.sh"
            {{- end }}
            # Raid starts, for valheim_raids: see raid-event.sh.
            - name: VALHEIM_LOG_FILTER_CONTAINS_RaidStarted
              value: "Random event set:"
            - name: ON_VALHEIM_LOG_FILTER_CONTAINS_RaidStarted
              value: "/etc/valheim-hooks/raid-event.sh"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.status.enabled }}
          startupProbe:
            httpGet:
              path: /status.json
              port: {{ .Values.status.port }}
            periodSeconds: 10
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /status.json
              port: {{ .Values.status.port }}
            periodSeconds: 30
            failureThreshold: 3
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /config
              subPath: config
            - name: data
              mountPath: /opt/valheim
              subPath: valheim
            - name: hooks
              mountPath: /etc/valheim-hooks
            - name: status-share
              mountPath: /var/run/valheim-status
        {{- if .Values.statusMetrics.enabled }}
        {{- include "game-server.statusMetricsContainer" . | nindent 8 }}
        {{- end }}
      volumes:
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        - name: hooks
          configMap:
            name: {{ include "game-server.fullname" . }}-hooks
            defaultMode: 0755
        - name: status-share
          emptyDir: {}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
