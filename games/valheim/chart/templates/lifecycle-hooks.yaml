apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "game-server.fullname" . }}-hooks
  labels:
    {{- include "game-server.labels" . | nindent 4 }}
data:
  # Run by the image's ON_VALHEIM_LOG_FILTER_* hooks with the log line on stdin. The
  # query protocol has no player names, so this keeps one file per online character.
  player-event.sh: |
    #!/bin/sh
    players_dir=/var/run/valheim-status/players
    mkdir -p "$players_dir/online"
    IFS= read -r log_line || exit 0
    touch "$players_dir/last-activity"  # read by backup-gate.sh
    case "$log_line" in
      *"Got handshake from client "*)
        steam_id=${log_line##*Got handshake from client }; printf '%s' "${steam_id%% *}" > "$players_dir/last-handshake" ;;
      *"Got character ZDOID from "*)
        character_and_zdoid=${log_line##*Got character ZDOID from }; zdoid=${character_and_zdoid##* : }
        name=$(printf '%s' "${character_and_zdoid% : *}" | tr -d '/')
        [ -n "$name" ] || exit 0
        # ZDOID 0:0 is a death, not a join. One line per death; status-metrics folds
        # them into its database, so nothing but status-metrics ever writes that file.
        if [ "${zdoid%%:*}" = 0 ]; then
          printf '%s\n' "$name" >> "$players_dir/deaths"
          exit 0
        fi
        # A respawn keeps the SteamID from the join, not whoever handshook last.
        [ ! -f "$players_dir/online/$name" ] && cat "$players_dir/last-handshake" > "$players_dir/online/$name" 2>/dev/null ;;
      *"Closing socket "*)
        steam_id=${log_line##*Closing socket }; steam_id=${steam_id%% *}
        for online_file in "$players_dir/online"/*; do
          [ -f "$online_file" ] && [ "$(cat "$online_file")" = "$steam_id" ] && rm -f "$online_file"
        done ;;
    esac
    exit 0
  # Run by ON_VALHEIM_LOG_FILTER_CONTAINS_ServerConnected: the listening hook fires before Steam lists the
  # server. Steam logs the line again after a reconnect, so one alert per server run; notify.sh down clears it.
  announce-online.sh: |
    #!/bin/sh
    announced=/tmp/online-announced
    [ -e "$announced" ] && exit 0
    touch "$announced"
    nohup sh -c "sleep ${ONLINE_ALERT_DELAY_SECONDS:-0}; /etc/valheim-hooks/notify.sh started" >/dev/null 2>&1 &
  # Run by ON_VALHEIM_LOG_FILTER_CONTAINS_RaidStarted. One "<unix time> <event name>"
  # line per raid; status-metrics folds them into its database and nothing else writes it.
  raid-event.sh: |
    #!/bin/sh
    IFS= read -r log_line || exit 0
    name=$(printf '%s' "${log_line##*Random event set:}" | tr -d '\r ')
    [ -n "$name" ] && printf '%s %s\n' "$(date +%s)" "$name" >> /var/run/valheim-status/raids
    exit 0
  # Exit 0 if players are on (A2S backs up the log hook) or were since the
  # newest backup. As a post-backup hook, $1 is the backup to ignore.
  backup-gate.sh: |
    #!/bin/sh
    players=/var/run/valheim-status/players
    if [ -n "$(ls -A "$players/online" 2>/dev/null)" ] ||
      /usr/local/bin/valheim-status 2>/dev/null | grep -q '"player_count": [1-9]'; then
      mkdir -p "$players" && touch "$players/last-activity"; exit 0
    fi
    [ -f "$players/last-activity" ] || exit 1
    last=$(ls -t /config/backups/*.zip 2>/dev/null | grep -vxF "${1:-}" | head -1)
    [ -z "$last" ] || [ "$players/last-activity" -nt "$last" ]
  backup-prune.sh: |
    {{- .Files.Get "files/backup-prune.sh" | nindent 4 }}
  backup-rename.sh: |
    {{- .Files.Get "files/backup-rename.sh" | nindent 4 }}
  # SOURCED by valheim-server's PRE_SERVER_RUN_HOOK, never executed: only a
  # same-shell run can clear DOORSTOP_ENABLED before the server launches.
  mod-guard.sh: |
    # No set -e and no exit in here -- both would take down the caller's shell.
    mod_guard() {
      [ "${BEPINEX:-false}" = true ] || return 0
      [ "${MOD_FAIL_SAFE:-false}" = true ] || return 0

      status_dir="/var/run/valheim-status"
      doorstop_lib="/opt/valheim/bepinex/doorstop_libs/libdoorstop_x64.so"
      reason=""

      # The loader breaking is the failure that crash-loops the server, e.g.
      # a BepInEx build needing a newer GLIBC than this image has.
      if [ ! -f "$doorstop_lib" ]; then
        reason="libdoorstop is missing"
      elif ldd "$doorstop_lib" 2>&1 | grep -q "not found"; then
        reason="libdoorstop has unresolved libraries: $(ldd "$doorstop_lib" 2>&1 | grep 'not found' | awk '{print $1}' | tr '\n' ' ')"
      fi

      if [ -z "$reason" ] && [ "${MOD_REQUIRE_APPROVED_BUILD:-false}" = true ]; then
        manifest=$(find /opt/valheim -maxdepth 4 -name 'appmanifest_896660.acf' 2>/dev/null | head -1)
        current=""
        [ -n "$manifest" ] && current=$(grep -m1 '"buildid"' "$manifest" | grep -oE '[0-9]+' | tail -1)
        approved=$(cat /config/mods-approved-build 2>/dev/null || true)
        if [ -z "$approved" ]; then
          reason="no game build has been approved for the installed mods"
        elif [ "$current" != "$approved" ]; then
          reason="game build $current is not the approved build $approved"
        fi
      fi

      mkdir -p "$status_dir"
      if [ -n "$reason" ]; then
        # Clear both: with only DOORSTOP_ENABLED=0 an unloadable libdoorstop
        # would still be LD_PRELOADed and still kill the server.
        export DOORSTOP_ENABLED=0
        SERVER_LD_PRELOAD=""
        echo 0 > "$status_dir/mods-active"
        printf '%s' "$reason" > "$status_dir/mods-status"
        echo "mod-guard: starting WITHOUT mods -- $reason" >&2
        [ -x /etc/valheim-hooks/notify.sh ] && \
          /etc/valheim-hooks/notify.sh mods-disabled "$reason" || true
      else
        echo 1 > "$status_dir/mods-active"
        printf 'mods active' > "$status_dir/mods-status"
      fi
    }
    mod_guard
  approve-mods.sh: |
    #!/bin/sh
    # Records the running game build as validated, re-enabling mods on the
    # next start. Run via `make approve-mods` after testing the server modded.
    set -eu
    manifest=$(find /opt/valheim -maxdepth 4 -name 'appmanifest_896660.acf' 2>/dev/null | head -1)
    [ -n "$manifest" ] || { echo "no appmanifest found" >&2; exit 1; }
    build=$(grep -m1 '"buildid"' "$manifest" | grep -oE '[0-9]+' | tail -1)
    [ -n "$build" ] || { echo "could not read buildid" >&2; exit 1; }
    printf '%s' "$build" > /config/mods-approved-build
    echo "approved build $build; mods will load on next start"
  {{- include "game-server.sharedHookScripts" . | nindent 2 }}

  notify.sh: |
    #!/bin/sh
    # Records lifecycle timestamps for status-metrics and posts a Discord embed.
    # Not POST_START_HOOK: it fires on plain restarts, faking updates.
    set -eu
    status_dir="/var/run/valheim-status"
    connect="${CONNECT_HOST:-}${CONNECT_HOST:+:${SERVER_PORT:-2456}}"
    # Steam build ID, not the human "1.0.14" version: only the install knows it, gamedig can't.
    read_build_id() {
      manifest=$(find /opt/valheim -maxdepth 4 -name 'appmanifest_896660.acf' 2>/dev/null | head -1)
      [ -n "$manifest" ] && grep -m1 '"buildid"' "$manifest" | grep -oE '[0-9]+' | tail -1 || true
    }

    # Inline code, not a markdown link: Discord only auto-links http(s).
    join_link=""
    build_change=""
    case "$1" in
      started)
        date +%s > "$status_dir/last-started.timestamp"
        read_build_id > "$status_dir/build-id"
        title="Server online"; colour=3066993
        description="**${SERVER_NAME}** is up and accepting connections."
        [ -n "$connect" ] && join_link="\`steam://connect/$connect\`"
        ;;
      down)
        /etc/valheim-hooks/record-uptime.sh "$status_dir" /config/uptime-accumulator.seconds
        rm -f /tmp/online-announced
        title="Server down"; colour=15548997
        description="**${SERVER_NAME}** is shutting down."
        ;;
      updated)
        date +%s > "$status_dir/last-updated.timestamp"
        # build-id still holds the previous build: the "started" hook after the restart rewrites it.
        previous_build=$(cat "$status_dir/build-id" 2>/dev/null || true)
        new_build=$(read_build_id)
        title="Server updating"; colour=5793266
        description="**${SERVER_NAME}** was updated and is restarting."
        if [ -n "$previous_build" ] && [ -n "$new_build" ] && [ "$previous_build" != "$new_build" ]; then
          description="**${SERVER_NAME}** was updated from build ${previous_build} to ${new_build} and is restarting."
          build_change="$previous_build -> $new_build"
        elif [ -n "$new_build" ]; then
          description="**${SERVER_NAME}** was updated to build ${new_build} and is restarting."
          build_change="$new_build"
        fi
        ;;
      mods-disabled)
        title="Mods disabled"; colour=16705372
        description="**${SERVER_NAME}** is starting without mods: ${2:-unknown reason}. The server is up; run \`make approve-mods\` once mods are verified."
        ;;
      *)
        title="Server event"; colour=9807270
        description="**${SERVER_NAME}**: $1"
        ;;
    esac
    /etc/valheim-hooks/post-discord-embed.sh "$title" "$colour" "$description" \
      Connect "$connect" World "${WORLD_NAME:-}" Join "$join_link" Build "$build_change"
