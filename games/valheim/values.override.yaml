# Overrides chart/values.yaml. Secrets never go here.

server:
  public: true
  crossplay: false
  # -setkey fire: fire spreads and damages wood outside the Ashlands too.
  # -saveinterval 600: the world reaches disk every 10 minutes, as often as it is backed up,
  # so a restore lands within a save of the archive's own time. The game's default is 1800.
  extraArgs: "-modifier resources more -modifier deathPenalty casual -modifier portals casual -setkey fire -saveinterval 600"

mods:
  enabled: true

# update-countdown.sh warns players for 30 minutes instead of the updater
# waiting for an empty server; it needs VALHEIM_RCON_PASSWORD in .env.
updates:
  ifIdle: false

# updateMode stays "Off" (chart default) -- recommendations only, never
# evictions. See docs/architecture.md and platform/vpa/install.sh.
verticalPodAutoscaler:
  enabled: true

persistence:
  storageClassName: local-path
  size: 5Gi

# To run one game at a time, keep game requests summed above node allocatable:
# the second game then stays Pending instead of starving the first.
resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    memory: 6Gi
