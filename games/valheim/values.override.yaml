# Overrides charts/valheim-server/values.yaml. Secrets never go here.

server:
  displayName: "Valheim Kaunas"
  worldName: "Kaunas" # changing this starts a NEW world
  public: true
  crossplay: false
  extraArgs: "-modifier resources more -modifier raids more -modifier deathPenalty casual"

mods:
  enabled: true

# updateMode stays "Off" (chart default) -- recommendations only, never
# evictions. See docs/architecture.md and install/vpa.sh.
verticalPodAutoscaler:
  enabled: true

persistence:
  storageClassName: local-path
  size: 5Gi

# 10GB/16vCPU host, one game at a time. Request + Zomboid's exceeds the node,
# so the second game stays Pending instead of starving the first. Peak seen: 3.1Gi.
resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    memory: 6Gi
