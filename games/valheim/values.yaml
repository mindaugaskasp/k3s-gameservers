server:
  name: "Valheim Kaunas"
  worldName: "Kaunas"
  public: true
  crossplay: false
  args: "-modifier resources more -modifier raids more -modifier deathPenalty casual"

persistence:
  storageClassName: local-path
  size: 5Gi

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 4Gi

# Off until scripts/install-monitoring.sh is run (CRDs not installed yet).
verticalPodAutoscaler:
  enabled: false
  updateMode: "Off"

serviceMonitor:
  enabled: false
