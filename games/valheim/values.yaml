game:
  shortname: vh
  name: Valheim

image:
  tag: vh

ports:
  - name: game
    containerPort: 2456
    protocol: UDP
    nodePort: 32456
  - name: query
    containerPort: 2457
    protocol: UDP
    nodePort: 32457
  - name: extra
    containerPort: 2458
    protocol: UDP
    nodePort: 32458

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

persistence:
  storageClassName: local-path
  size: 5Gi

instanceConfig:
  public: "1"
  servername: "Valheim Server"
  worldname: "Dedicated"
  worldmodifiers: "-modifier resources more -modifier raids more -modifier deathPenalty casual"
  statusalert: "on"
  discordalert: "on"

metricsExporter:
  enabled: true
  gamediggame: valheim
  queryPort: "2457"

verticalPodAutoscaler:
  enabled: true
  updateMode: "Off"

# Needs `pgrep` in the image; verify if you swap images.
livenessProbe:
  exec:
    command: ["pgrep", "-f", "valheim_server"]
  initialDelaySeconds: 60
  periodSeconds: 30
  failureThreshold: 3

maintenance:
  updateSchedule: "0 1 * * *"
  restartSchedule: "0 2 * * *"
  lgsmUpdateSchedule: "0 3 * * 0"
