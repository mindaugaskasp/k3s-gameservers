server:
  name: "Valheim Kaunas"
  worldName: "Kaunas"
  public: true
  crossplay: false
  args: "-modifier resources more -modifier raids more -modifier deathPenalty casual"

persistence:
  storageClassName: local-path
  size: 5Gi

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 4Gi

verticalPodAutoscaler:
  enabled: true
  updateMode: "Off"
