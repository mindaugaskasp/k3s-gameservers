apiVersion: v2
name: vrising-server
description: V Rising dedicated server as a single-replica StatefulSet, backed by the trueosiris/vrising image.
type: application
version: 0.1.0
# Tracks the image tag in values.yaml. The image updates the game on every start.
appVersion: "latest"
keywords:
  - vrising
  - game-server
  - k3s
home: https://github.com/TrueOsiris/docker-vrising

dependencies:
  # Copied into charts/ by `make` (helm dependency update) before every helm command.
  - name: game-server
    version: 0.1.0
    repository: file://../../../game-server/chart
