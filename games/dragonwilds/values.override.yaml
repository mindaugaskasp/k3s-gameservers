# Overrides chart/values.yaml. Secrets never go here; games/dragonwilds/.env overrides the server settings.

persistence:
  storageClassName: local-path
  size: 20Gi

# Sizing rules: docs/architecture.md#sizing.
resources:
  requests:
    cpu: "1"
    memory: 4Gi
  limits:
    memory: 6Gi

# updateMode stays "Off" (chart default) -- recommendations only, never
# evictions. See docs/architecture.md and platform/vpa/install.sh.
verticalPodAutoscaler:
  enabled: true
