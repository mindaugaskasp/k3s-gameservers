{{- $data := include "enshrouded.dataPath" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "game-server.fullname" . }}
  labels:
    {{- include "game-server.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "game-server.fullname" . }}
  # Keep the live replica count so an upgrade never restarts a game scaled to 0.
  {{- $live := lookup "apps/v1" "StatefulSet" .Release.Namespace (include "game-server.fullname" .) }}
  replicas: {{ if $live }}{{ $live.spec.replicas }}{{ else }}1{{ end }}
  selector:
    matchLabels:
      {{- include "game-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "game-server.labels" . | nindent 8 }}
    spec:
      # The image gives the game 90s to save and exit, then kills wineserver.
      terminationGracePeriodSeconds: 120
      containers:
        - name: gameserver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: game
              containerPort: {{ .Values.server.queryPort }}
              protocol: UDP
          env:
            # Every SERVER_* var is an enshrouded_server.json key.
            # https://github.com/mornedhels/enshrouded-server#environment-variables
            - name: SERVER_NAME
              value: {{ .Values.server.name | quote }}
            - name: SERVER_SLOT_COUNT
              value: {{ .Values.server.slotCount | quote }}
            - name: SERVER_QUERYPORT
              value: {{ .Values.server.queryPort | quote }}
            - name: SERVER_IP
              value: "0.0.0.0"
            - name: SERVER_SAVE_DIR
              value: {{ printf "%s/savegame" $data | quote }}
            - name: SERVER_LOG_DIR
              value: {{ printf "%s/logs" $data | quote }}
            - name: SERVER_ENABLE_VOICE_CHAT
              value: {{ .Values.server.voiceChat | quote }}
            - name: SERVER_VOICE_CHAT_MODE
              value: {{ .Values.server.voiceChatMode | quote }}
            - name: SERVER_ENABLE_TEXT_CHAT
              value: {{ .Values.server.textChat | quote }}
            - name: GAME_BRANCH
              value: {{ .Values.server.branch | quote }}
            - name: TZ
              value: {{ .Values.server.timeZone | quote }}
            # The start-up chown hands the whole volume to this uid, the exporter's database
            # included, so it must match the status-metrics user.
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            {{- range $key, $value := .Values.gameSettings }}
            - name: SERVER_GS_{{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $i, $role := .Values.roles }}
            - name: SERVER_ROLE_{{ $i }}_NAME
              value: {{ $role.name | quote }}
            - name: SERVER_ROLE_{{ $i }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "game-server.secretName" $ }}
                  key: {{ $role.secretKey }}
            - name: SERVER_ROLE_{{ $i }}_CAN_KICK_BAN
              value: {{ $role.canKickBan | default false | quote }}
            - name: SERVER_ROLE_{{ $i }}_CAN_ACCESS_INVENTORIES
              value: {{ $role.canAccessInventories | default false | quote }}
            - name: SERVER_ROLE_{{ $i }}_CAN_EDIT_BASE
              value: {{ $role.canEditBase | default false | quote }}
            - name: SERVER_ROLE_{{ $i }}_CAN_EXTEND_BASE
              value: {{ $role.canExtendBase | default false | quote }}
            - name: SERVER_ROLE_{{ $i }}_RESERVED_SLOTS
              value: {{ $role.reservedSlots | default 0 | quote }}
            {{- end }}
            {{- if .Values.updates.cron }}
            - name: UPDATE_CRON
              value: {{ .Values.updates.cron | quote }}
            - name: UPDATE_CHECK_PLAYERS
              value: {{ .Values.updates.ifIdle | quote }}
            - name: UPDATE_POST_HOOK
              value: "/etc/enshrouded-hooks/notify.sh updated"
            {{- end }}
            {{- if .Values.restart.cron }}
            - name: RESTART_CRON
              value: {{ .Values.restart.cron | quote }}
            - name: RESTART_CHECK_PLAYERS
              value: {{ .Values.restart.ifIdle | quote }}
            {{- end }}
            {{- if .Values.backups.cron }}
            - name: BACKUP_CRON
              value: {{ .Values.backups.cron | quote }}
            - name: BACKUP_DIR
              value: {{ printf "%s/backups" $data | quote }}
            - name: BACKUP_MAX_COUNT
              value: {{ .Values.backups.maxCount | quote }}
            {{- end }}
            {{- if .Values.server.connectHost }}
            - name: CONNECT_HOST
              value: {{ .Values.server.connectHost | quote }}
            {{- end }}
            {{- if .Values.alerts.enabled }}
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "game-server.discordSecretName" . }}
                  key: DISCORD_WEBHOOK_URL
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # First boot downloads the game, which takes a while.
          startupProbe:
            exec:
              command: ["pgrep", "-f", "enshrouded_server.exe"]
            periodSeconds: 10
            failureThreshold: 180
          # Not the game process: the image's updater stops it in place while
          # steamcmd runs, which would trip a liveness check on it.
          livenessProbe:
            exec:
              command: ["pgrep", "-x", "supervisord"]
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "/etc/enshrouded-hooks/started.sh"]
            preStop:
              exec:
                command: ["/bin/sh", "/etc/enshrouded-hooks/down.sh"]
          volumeMounts:
            - name: data
              mountPath: {{ $data }}
            - name: hooks
              mountPath: /etc/enshrouded-hooks
            - name: status-share
              mountPath: /var/run/enshrouded-status
        {{- if .Values.statusMetrics.enabled }}
        {{- include "game-server.statusMetricsContainer" . | nindent 8 }}
        {{- end }}
      volumes:
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        - name: hooks
          configMap:
            name: {{ include "game-server.fullname" . }}-hooks
            defaultMode: 0755
        - name: status-share
          emptyDir: {}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
