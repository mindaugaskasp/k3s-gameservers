apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "game-server.fullname" . }}-hooks
  labels:
    {{- include "game-server.labels" . | nindent 4 }}
data:
  {{- include "game-server.sharedHookScripts" . | nindent 2 }}

  # The image has no "server started" hook, so start/stop come from the
  # statefulset's `lifecycle:` block; updates come from UPDATE_POST_HOOK.
  notify.sh: |
    #!/bin/sh
    set -u
    status_dir="/var/run/enshrouded-status"
    build_file="/opt/enshrouded/.last-known-build"
    connect="${CONNECT_HOST:-}${CONNECT_HOST:+:${SERVER_QUERYPORT:-15637}}"

    # Runs as root (lifecycle hooks) or as the game user (image hooks), so
    # write through a temp file the owning directory allows replacing.
    write_file() {
      printf '%s' "$2" > "$1.tmp.$$" 2>/dev/null || return 0
      chmod 0666 "$1.tmp.$$" 2>/dev/null
      mv -f "$1.tmp.$$" "$1" 2>/dev/null || rm -f "$1.tmp.$$"
    }

    new_build=$(cat /opt/enshrouded/current_version 2>/dev/null || true)
    old_build=$(cat "$build_file" 2>/dev/null || true)
    [ -n "$new_build" ] && write_file "$status_dir/build-id" "$new_build"

    build_change=""
    case "$1" in
      started) title="Server online"; colour=3066993; description="**${SERVER_NAME}** is up and accepting connections." ;;
      updated)
        title="Server updated"; colour=5793266; description="**${SERVER_NAME}** restarted."
        if [ -n "$old_build" ] && [ -n "$new_build" ] && [ "$old_build" != "$new_build" ]; then
          description="**${SERVER_NAME}** was updated from build ${old_build} to ${new_build} and is back up."
          build_change="$old_build -> $new_build"
        fi
        ;;
      down) title="Server down"; colour=15548997; description="**${SERVER_NAME}** is shutting down." ;;
      *) title="Server event"; colour=9807270; description="**${SERVER_NAME}**: $1" ;;
    esac
    [ -n "$new_build" ] && write_file "$build_file" "$new_build"
    /etc/enshrouded-hooks/post-discord-embed.sh "$title" "$colour" "$description" Connect "$connect" Build "$build_change"

  # postStart must return fast (kubelet blocks Running on it) -- just
  # backgrounds the real logic below.
  started.sh: |
    #!/bin/sh
    nohup /etc/enshrouded-hooks/started-wait.sh >/tmp/enshrouded-started-hook.log 2>&1 &
    exit 0

  # Waits for the server to answer Steam queries, then notifies. World-writable
  # status dir: the image's own hooks run as the unprivileged game user.
  started-wait.sh: |
    #!/bin/sh
    set -u
    status_dir="/var/run/enshrouded-status"
    port="${SERVER_QUERYPORT:-15637}"
    mkdir -p "$status_dir" && chmod 0777 "$status_dir"

    # The image installs python-a2s for the game user only, so ask as them.
    query() {
      su enshrouded -s /bin/sh -c "python3 -c \"import a2s; a2s.info(('127.0.0.1', $port))\"" >/dev/null 2>&1
    }

    attempt=0
    # ~60 minutes: the first boot downloads the game before it can answer.
    until query; do
      attempt=$((attempt + 1))
      [ "$attempt" -ge 360 ] && { echo "started-hook: no query response, giving up" >&2; exit 0; }
      sleep 10
    done

    date +%s > "$status_dir/last-started.timestamp"
    /etc/enshrouded-hooks/notify.sh started

  # Runs before SIGTERM and counts against terminationGracePeriodSeconds -- kept fast.
  down.sh: |
    #!/bin/sh
    /etc/enshrouded-hooks/record-uptime.sh /var/run/enshrouded-status /opt/enshrouded/uptime-accumulator.seconds
    /etc/enshrouded-hooks/notify.sh down
