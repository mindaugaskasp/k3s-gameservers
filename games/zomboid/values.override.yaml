# Overrides charts/zomboid-server/values.yaml. Secrets never go here.
# Sized for the 10GB/16vCPU host, one game at a time (see games/valheim override).

server:
  name: "Zomboid_Kaunas" # the world's folder is already Zomboid_Kaunas
  displayName: "Zomboid Kaunas"
  adminUsername: "admin"
  public: false
  pvp: false
  maxPlayers: 8
  memoryXmxGb: 3 # ZGC commits the full heap as shmem; Xmx 2 peaked at 4Gi (~Xmx+2)
  # mods: ["ModID1"]; workshopItems: ["123456789"]

persistence:
  storageClassName: local-path
  size: 10Gi

resources:
  requests:
    cpu: "2"
    memory: 5Gi
  limits:
    memory: 6Gi

backups:
  periodMinutes: 60
  count: 120
