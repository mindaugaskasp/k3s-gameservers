# Overrides charts/zomboid-server/values.yaml. Secrets never go here.
# Sizing: see the resources comment in games/valheim/values.override.yaml.

server:
  name: "Zomboid_Kaunas" # the world's folder is already Zomboid_Kaunas
  displayName: "Zomboid Kaunas"
  adminUsername: "admin"
  public: false
  pvp: false
  maxPlayers: 8
  memoryXmxGb: 3 # ZGC commits the full heap as shmem; Xmx 2 peaked at 4Gi (~Xmx+2)
  # Mods live in mods.json: `make add-mod WORKSHOP_ID=...`.

persistence:
  storageClassName: local-path
  size: 10Gi

resources:
  requests:
    cpu: "2"
    memory: 5Gi
  limits:
    memory: 6Gi

backups:
  periodMinutes: 60
  count: 120
