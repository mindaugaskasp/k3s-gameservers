apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "game-server.fullname" . }}-hooks
  labels:
    {{- include "game-server.labels" . | nindent 4 }}
data:
  {{- include "game-server.sharedHookScripts" . | nindent 2 }}

  # No PRE/POST_*_HOOK system on this image -- wired via the statefulset's
  # `lifecycle:` block instead.
  notify.sh: |
    #!/bin/sh
    set -u
    connect="${CONNECT_HOST:-}${CONNECT_HOST:+:${PORT_UDP_MAIN:-16261}}"
    build_change=""
    case "$1" in
      started) title="Server online"; colour=3066993; description="**${SERVER_NAME}** is up and accepting connections." ;;
      updated)
        title="Server updating"; colour=5793266; description="**${SERVER_NAME}** restarted."
        if [ -n "${2:-}" ] && [ -n "${3:-}" ] && [ "$2" != "$3" ]; then
          description="**${SERVER_NAME}** was updated from build ${2} to ${3} and is back up."
          build_change="$2 -> $3"
        fi
        ;;
      down) title="Server down"; colour=15548997; description="**${SERVER_NAME}** is shutting down." ;;
      *) title="Server event"; colour=9807270; description="**${SERVER_NAME}**: $1" ;;
    esac
    /etc/zomboid-hooks/post-discord-embed.sh "$title" "$colour" "$description" Connect "$connect" Build "$build_change"

  # postStart must return fast (kubelet blocks Running on it) -- just
  # backgrounds the real logic below.
  started.sh: |
    #!/bin/sh
    nohup /etc/zomboid-hooks/started-wait.sh >/tmp/zomboid-started-hook.log 2>&1 &
    exit 0

  # Polls RCON (closest signal to "world loaded" this image gives), then notifies.
  started-wait.sh: |
    #!/bin/sh
    set -u
    status_dir="/var/run/zomboid-status"
    build_file="${CONFIG_DIR:-/project-zomboid-config}/.last-known-build"
    mkdir -p "$status_dir"

    rcon_port="${PORT_TCP_RCON:-27015}"
    attempt=0
    # ~30 minutes: a large modded Build 42 world can take a while to load.
    until nc -z 127.0.0.1 "$rcon_port" 2>/dev/null; do
      attempt=$((attempt + 1))
      [ "$attempt" -ge 180 ] && { echo "started-hook: RCON never came up, giving up" >&2; exit 0; }
      sleep 10
    done

    date +%s > "$status_dir/last-started.timestamp"

    manifest=$(find "${GAME_DIR:-/project-zomboid}" -maxdepth 3 -name 'appmanifest_380870.acf' 2>/dev/null | head -1)
    new_build=""
    [ -n "$manifest" ] && new_build=$(grep -m1 '"buildid"' "$manifest" | grep -oE '[0-9]+' | tail -1)
    [ -n "$new_build" ] && printf '%s' "$new_build" > "$status_dir/build-id"

    old_build=$(cat "$build_file" 2>/dev/null || true)
    if [ -n "$old_build" ] && [ -n "$new_build" ] && [ "$old_build" != "$new_build" ]; then
      /etc/zomboid-hooks/notify.sh updated "$old_build" "$new_build"
    else
      /etc/zomboid-hooks/notify.sh started
    fi
    [ -n "$new_build" ] && printf '%s' "$new_build" > "$build_file"

  # Runs before SIGTERM and counts against terminationGracePeriodSeconds -- kept fast.
  down.sh: |
    #!/bin/sh
    /etc/zomboid-hooks/record-uptime.sh /var/run/zomboid-status "${CONFIG_DIR:-/project-zomboid-config}/uptime-accumulator.seconds"
    /etc/zomboid-hooks/notify.sh down
