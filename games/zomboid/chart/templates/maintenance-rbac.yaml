{{- if .Values.updates.cron }}
# For the update CronJob: exec into the game pod (RCON player count), and
# restart its StatefulSet. Scoped to this namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "game-server.fullname" . }}-maintenance
  labels:
    {{- include "game-server.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "game-server.fullname" . }}-maintenance
  labels:
    {{- include "game-server.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: [{{ include "game-server.fullname" . | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "game-server.fullname" . }}-maintenance
  labels:
    {{- include "game-server.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "game-server.fullname" . }}-maintenance
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "game-server.fullname" . }}-maintenance
  apiGroup: rbac.authorization.k8s.io
{{- end }}
