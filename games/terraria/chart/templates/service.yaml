apiVersion: v1
kind: Service
metadata:
  name: {{ include "game-server.fullname" . }}
  labels:
    {{- include "game-server.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "game-server.selectorLabels" . | nindent 4 }}
  # Only the game port: TShock's REST API (7878) stays inside the pod.
  ports:
    - name: game
      port: 7777
      targetPort: 7777
      protocol: TCP
      nodePort: {{ .Values.service.nodePorts.game }}
