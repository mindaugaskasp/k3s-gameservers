{{- if not .Values.secretRef }}
{{- /* The tokens are made on first install and kept after, so an upgrade never changes them. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "game-server.secretName" .) }}
{{- $existingData := $existing.data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "game-server.secretName" . }}
  labels:
    {{- include "game-server.labels" . | nindent 4 }}
type: Opaque
data:
  STATUS_TOKEN: {{ index $existingData "STATUS_TOKEN" | default (randAlphaNum 32 | b64enc) }}
  SHUTDOWN_TOKEN: {{ index $existingData "SHUTDOWN_TOKEN" | default (randAlphaNum 32 | b64enc) }}
  SERVER_PASSWORD: {{ .Values.secrets.serverPassword | b64enc | quote }}
{{- end }}
