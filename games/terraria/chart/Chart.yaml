apiVersion: v2
name: terraria-server
description: Terraria server with TShock as a single-replica StatefulSet, backed by the ryshe/terraria image.
type: application
version: 0.1.0
# Tracks the image tag in values.yaml, which pins the TShock release.
appVersion: "latest"
keywords:
  - terraria
  - tshock
  - game-server
  - k3s
home: https://github.com/ryansheehan/terraria

dependencies:
  # Copied into charts/ by `make` (helm dependency update) before every helm command.
  - name: game-server
    version: 0.1.0
    repository: file://../../../game-server/chart
