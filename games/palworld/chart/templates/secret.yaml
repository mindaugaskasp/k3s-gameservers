{{- if not .Values.secretRef }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "game-server.secretName" . }}
  labels:
    {{- include "game-server.labels" . | nindent 4 }}
type: Opaque
data:
  SERVER_PASSWORD: {{ .Values.secrets.serverPassword | b64enc | quote }}
  ADMIN_PASSWORD: {{ required "secrets.adminPassword is required: set PALWORLD_ADMIN_PASSWORD in .env" .Values.secrets.adminPassword | b64enc | quote }}
{{- end }}
