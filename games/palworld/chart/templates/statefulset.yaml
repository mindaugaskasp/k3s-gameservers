{{- $data := include "palworld.dataPath" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "game-server.fullname" . }}
  labels:
    {{- include "game-server.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "game-server.fullname" . }}
  # Keep the live replica count so an upgrade never restarts a game scaled to 0.
  {{- $live := lookup "apps/v1" "StatefulSet" .Release.Namespace (include "game-server.fullname" .) }}
  replicas: {{ if $live }}{{ $live.spec.replicas }}{{ else }}1{{ end }}
  selector:
    matchLabels:
      {{- include "game-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "game-server.labels" . | nindent 8 }}
    spec:
      # SIGTERM makes the image save over RCON and stop the server; give it time.
      terminationGracePeriodSeconds: 90
      initContainers:
        {{- include "game-server.volumeFoldersInitContainer" (list "backups" "database/sqlite") | nindent 8 }}
      containers:
        - name: gameserver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: game
              containerPort: {{ .Values.server.gamePort }}
              protocol: UDP
          # https://github.com/thijsvanloef/palworld-server-docker#environment-variables
          env:
            - name: PORT
              value: {{ .Values.server.gamePort | quote }}
            - name: SERVER_NAME
              value: {{ .Values.server.name | quote }}
            - name: PLAYERS
              value: {{ .Values.server.slotCount | quote }}
            - name: COMMUNITY
              value: {{ .Values.server.community | quote }}
            - name: SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "game-server.secretName" . }}
                  key: SERVER_PASSWORD
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "game-server.secretName" . }}
                  key: ADMIN_PASSWORD
            # RCON is how the image saves the world before stopping on SIGTERM.
            - name: RCON_ENABLED
              value: "true"
            - name: RCON_PORT
              value: {{ .Values.server.rconPort | quote }}
            # The REST API answers the exporter's status query; admin basic auth, pod-only.
            - name: REST_API_ENABLED
              value: "true"
            - name: REST_API_PORT
              value: {{ .Values.server.restApiPort | quote }}
            - name: UPDATE_ON_BOOT
              value: {{ .Values.updates.onBoot | quote }}
            - name: TZ
              value: {{ .Values.server.timeZone | quote }}
            # The start-up chown hands the whole volume to this uid, the exporter's database
            # included, so it must match the status-metrics user.
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            {{- if .Values.backups.cron }}
            - name: BACKUP_ENABLED
              value: "true"
            - name: BACKUP_CRON_EXPRESSION
              value: {{ .Values.backups.cron | quote }}
            - name: DELETE_OLD_BACKUPS
              value: "true"
            - name: OLD_BACKUP_DAYS
              value: {{ .Values.backups.keepDays | quote }}
            {{- end }}
            {{- range $key, $value := .Values.gameSettings }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.server.connectHost }}
            - name: CONNECT_HOST
              value: {{ .Values.server.connectHost | quote }}
            {{- end }}
            {{- if .Values.alerts.enabled }}
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "game-server.discordSecretName" . }}
                  key: DISCORD_WEBHOOK_URL
            # The image's own start, stop, join/leave and backup posts are off: the shared
            # hooks post start/stop, and hourly backup posts would flood the channel.
            - name: DISCORD_PRE_START_MESSAGE_ENABLED
              value: "false"
            - name: DISCORD_PRE_SHUTDOWN_MESSAGE_ENABLED
              value: "false"
            - name: DISCORD_POST_SHUTDOWN_MESSAGE_ENABLED
              value: "false"
            - name: DISCORD_PLAYER_JOIN_MESSAGE_ENABLED
              value: "false"
            - name: DISCORD_PLAYER_LEAVE_MESSAGE_ENABLED
              value: "false"
            - name: DISCORD_PRE_BACKUP_MESSAGE_ENABLED
              value: "false"
            - name: DISCORD_POST_BACKUP_MESSAGE_ENABLED
              value: "false"
            - name: DISCORD_PRE_BACKUP_DELETE_MESSAGE_ENABLED
              value: "false"
            - name: DISCORD_POST_BACKUP_DELETE_MESSAGE_ENABLED
              value: "false"
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # The first start downloads the game before the server process exists.
          startupProbe:
            exec:
              command: ["pgrep", "-f", {{ include "palworld.serverProcessPattern" . | quote }}]
            periodSeconds: 10
            failureThreshold: 360
          livenessProbe:
            exec:
              command: ["pgrep", "-f", {{ include "palworld.serverProcessPattern" . | quote }}]
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "/etc/game-hooks/started.sh"]
            # The image's SIGTERM handler saves and stops the server after this.
            preStop:
              exec:
                command: ["/bin/sh", "/etc/game-hooks/down.sh"]
          volumeMounts:
            - name: data
              mountPath: {{ $data }}
            - name: hooks
              mountPath: /etc/game-hooks
            - name: status-share
              mountPath: /var/run/palworld-status
        {{- if .Values.statusMetrics.enabled }}
        {{- include "game-server.statusMetricsContainer" . | nindent 8 }}
        {{- end }}
      volumes:
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        - name: hooks
          configMap:
            name: {{ include "game-server.fullname" . }}-hooks
            defaultMode: 0755
        - name: status-share
          emptyDir: {}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
