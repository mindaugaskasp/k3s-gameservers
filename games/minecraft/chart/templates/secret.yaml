{{- if not .Values.secretRef }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "game-server.secretName" . }}
  labels:
    {{- include "game-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  RCON_PASSWORD: {{ required "secrets.rconPassword is required: set MINECRAFT_RCON_PASSWORD in .env" .Values.secrets.rconPassword | quote }}
{{- end }}
