# Lives in k3s's auto-deploy manifests folder; k3s re-installs Traefik with these values.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        exposedPort: 80
        http: &crowdsec-bouncer
          # Created by platform/crowdsec/install.sh; routes fail while it is missing.
          middlewares: [crowdsec-bouncer@kubernetescrd]
        # Cloudflare proxies the site, so only its edges (cloudflare.com/ips) may name the real client.
        forwardedHeaders:
          trustedIPs: &cloudflare-edges
            - 173.245.48.0/20
            - 103.21.244.0/22
            - 103.22.200.0/22
            - 103.31.4.0/22
            - 141.101.64.0/18
            - 108.162.192.0/18
            - 190.93.240.0/20
            - 188.114.96.0/20
            - 197.234.240.0/22
            - 198.41.128.0/17
            - 162.158.0.0/15
            - 104.16.0.0/13
            - 104.24.0.0/14
            - 172.64.0.0/13
            - 131.0.72.0/22
            - 2400:cb00::/32
            - 2606:4700::/32
            - 2803:f800::/32
            - 2405:b500::/32
            - 2405:8100::/32
            - 2a06:98c0::/29
            - 2c0f:f248::/32
      websecure:
        exposedPort: 443
        http: *crowdsec-bouncer
        forwardedHeaders:
          trustedIPs: *cloudflare-edges
    service:
      spec:
        # Route to a Traefik pod on the receiving node, which keeps the client source IP.
        externalTrafficPolicy: Local
    # CrowdSec's agent reads the access log from stdout.
    logs:
      access:
        enabled: true
    experimental:
      plugins:
        crowdsec-bouncer:
          moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          version: v1.7.1
