# k3s.service drop-in: don't start k3s (and mint certs) on an unsynced clock.
# The real fix is a UTC RTC on the hypervisor: docs/setup-nodes.md.
[Unit]
Wants=time-sync.target
After=time-sync.target

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 90); do [ "$(timedatectl show -p NTPSynchronized --value)" = yes ] && exit 0; sleep 1; done; echo "Clock not NTP-synchronized after 90s, starting k3s anyway"'
