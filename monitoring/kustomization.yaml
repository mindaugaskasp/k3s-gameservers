apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml
  - middleware.yaml
  - prometheus.yaml
  - loki.yaml
  - loki-ingress.yaml
  - alloy.yaml
  - grafana.yaml

configMapGenerator:
  - name: loki-config
    files: [config/loki.yaml]
  - name: alloy-config
    files: [config/config.alloy]
  - name: grafana-datasources
    files: [config/datasources.yaml]
  - name: grafana-dashboard-providers
    files: [config/dashboard-providers.yaml]
  # Host-specific values (gitignored); only feeds the replacements below, never applied.
  - name: site
    envs: [.env]
    options:
      annotations:
        config.kubernetes.io/local-config: "true"

replacements:
  - source: {kind: ConfigMap, name: site, fieldPath: data.GRAFANA_HOST}
    targets:
      - select: {kind: Ingress, name: grafana}
        fieldPaths: [spec.rules.0.host]
      - select: {kind: Deployment, name: grafana}
        fieldPaths: ["spec.template.spec.containers.[name=grafana].env.[name=GF_SERVER_ROOT_URL].value"]
        options: {delimiter: "/", index: 2}
  - source: {kind: ConfigMap, name: site, fieldPath: data.LOKI_HOST}
    targets:
      - select: {kind: Ingress, name: loki}
        fieldPaths: [spec.rules.0.host]
  - source: {kind: ConfigMap, name: site, fieldPath: data.LAN_CIDR}
    targets:
      - select: {kind: Middleware, name: lan-only}
        fieldPaths: [spec.ipAllowList.sourceRange.0]
