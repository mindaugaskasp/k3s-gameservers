# Mounts a game's volume while its StatefulSet is scaled to 0, so a backup can be unpacked
# over the world. `make restore-backup` fills in __RELEASE__, applies it, then deletes it.
apiVersion: v1
kind: Pod
metadata:
  name: __RELEASE__-restore-helper
  labels:
    app.kubernetes.io/part-of: k3s-gameservers
spec:
  restartPolicy: Never
  containers:
    - name: shell
      image: docker.io/library/alpine:3.24@sha256:3f4d6b32e26703c6082839234f43769d5046b3ac7c910033911d1e71d8cd630a
      command: ["sleep", "1800"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-__RELEASE__-0
