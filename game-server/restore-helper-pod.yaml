# Mounts a game's volume while its StatefulSet is scaled to 0, so a backup can be unpacked
# over the world. `make restore-backup` fills in __RELEASE__, applies it, then deletes it.
apiVersion: v1
kind: Pod
metadata:
  name: __RELEASE__-restore-helper
  labels:
    app.kubernetes.io/part-of: k3s-gameservers
spec:
  restartPolicy: Never
  containers:
    - name: shell
      image: docker.io/library/alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
      command: ["sleep", "1800"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-__RELEASE__-0
